services:
  - type: web
    name: pickle-time
    runtime: node
    plan: free               # sleeps after ~15 min idle; data lives in Turso
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: LIFF_ID
        sync: false          # set these four in the Render dashboard
      - key: LINE_CHANNEL_ID
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
